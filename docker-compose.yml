version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-orchestrator-postgres
    environment:
      POSTGRES_DB: payment_orchestrator
      POSTGRES_USER: payment_orchestrator
      POSTGRES_PASSWORD: payment_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - payment_orchestrator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-orchestrator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  payment_orchestrator_pgdata:
