version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-orchestrator-postgres
    environment:
      POSTGRES_DB: payment_orchestrator
      POSTGRES_USER: payment_orchestrator
      POSTGRES_PASSWORD: payment_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - payment_orchestrator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: payment-orchestrator-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode - no separate Zookeeper container needed.
  kafka:
    image: bitnami/kafka:3.7
    container_name: payment-orchestrator-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - payment_orchestrator_kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Optional but genuinely useful: browse topics/messages at localhost:8090
  # while demoing the outbox -> Kafka -> consumer flow.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: payment-orchestrator-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  payment_orchestrator_pgdata:
  payment_orchestrator_kafkadata:
